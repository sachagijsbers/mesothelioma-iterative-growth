[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meso-growth"
version = "0.1.0"
description = "Iterative mechanics-driven growth of a synthetic pleural tumour on a public thorax CT"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "matplotlib>=3.9",
    "nibabel>=5.0",
    "scikit-image>=0.24",
    "scikit-fem>=10.0",
    "pyamg>=5.0",
    "gmsh>=4.12",
    "trimesh>=4.0",
    "pyvista>=0.44",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
